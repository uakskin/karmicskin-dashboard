<style>
  /* ========== DESIGN SYSTEM TOKENS (Karmic Skin) ========== */
  /* The 6 brand colours never change. Dark mode swaps which ones are background/text. */
  :root {
    --porcelain: #F6F5F0;
    --citron:    #CAD183;
    --carbon:    #232526;
    --green:     #2F5350;
    --red:       #B22222;
    --amber:     #EFA71D;

    /* Semantic tokens — these are what the UI references. */
    --page-bg:    var(--porcelain);
    --ink:        var(--carbon);
    --line:       var(--carbon);
    --soft-bg:    var(--porcelain);
    --soft-ink:   var(--carbon);
    --soft-line:  var(--carbon);
    --line-soft:  rgba(35, 37, 38, 0.08);
    --line-hour:  rgba(35, 37, 38, 0.16);
    --shadow:     rgba(35, 37, 38, 0.12);
    --shadow-up:  rgba(35, 37, 38, 0.22);
  }
  /* Dark mode — Carbon becomes the page background, Porcelain becomes the ink.
     Dark Green work blocks and Citron meeting blocks stay exactly as they are. */
  [data-theme="dark"] {
    --page-bg:    var(--carbon);
    --ink:        var(--porcelain);
    --line:       var(--porcelain);
    --soft-bg:    var(--carbon);
    --soft-ink:   var(--porcelain);
    --soft-line:  var(--porcelain);
    --line-soft:  rgba(246, 245, 240, 0.10);
    --line-hour:  rgba(246, 245, 240, 0.22);
    --shadow:     rgba(0, 0, 0, 0.45);
    --shadow-up:  rgba(0, 0, 0, 0.65);
  }

  /* ========== BASE ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--page-bg); color: var(--ink); }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3, h4 { font-family: 'Domine', Georgia, serif; font-weight: 600; line-height: 1.2; color: var(--ink); }
  a { color: inherit; }
  button { font-family: 'Montserrat', sans-serif; }

  /* ========== HEADER ========== */
  .header {
    padding: 28px 32px 22px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
    background: var(--page-bg);
    position: sticky; top: 0; z-index: 10;
  }
  .header-left .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink);
  }
  .header-left h1 { font-size: 32px; margin-top: 6px; font-weight: 700; }
  .header-left .subtitle { font-size: 13.5px; margin-top: 6px; color: var(--ink); max-width: 520px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .save-status {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink);
    min-width: 92px; text-align: right; opacity: 0.55;
  }
  .save-status.saving { opacity: 1; }
  .save-status.saved  { opacity: 0.6; }
  .save-status.error  { color: var(--red); opacity: 1; }

  /* ========== BUTTONS (per design system) ========== */
  .btn {
    font-family: 'Montserrat', sans-serif; font-weight: 600;
    font-size: 13px; padding: 10px 18px; border-radius: 10px;
    cursor: pointer; transition: filter 0.15s, background 0.15s, color 0.15s;
    border: none;
  }
  .btn-primary { background: var(--red); color: var(--porcelain); }
  .btn-primary:hover { filter: brightness(0.92); }
  .btn-secondary { background: var(--ink); color: var(--page-bg); }
  .btn-secondary:hover { filter: brightness(1.1); }
  .btn-ghost {
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink);
  }
  .btn-ghost:hover { background: var(--ink); color: var(--page-bg); }
  .btn-ghost:disabled, .btn-ghost[disabled] {
    opacity: 0.35; cursor: not-allowed; background: transparent; color: var(--ink);
  }
  .btn-text {
    background: transparent; color: var(--ink); padding: 10px 14px;
    border: none; font-weight: 600;
  }
  .btn-text:hover { text-decoration: underline; }
  .btn-danger {
    background: transparent; color: var(--red); border: 1.5px solid var(--red);
  }
  .btn-danger:hover { background: var(--red); color: var(--porcelain); }
  .btn-icon {
    background: transparent; border: 1.5px solid var(--ink); color: var(--ink);
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; line-height: 1;
  }
  .btn-icon:hover { background: var(--ink); color: var(--page-bg); }
  .btn-icon svg { width: 16px; height: 16px; }

  /* ========== LEGEND ========== */
  .legend {
    display: flex; flex-wrap: wrap; gap: 18px;
    padding: 18px 32px 0;
    font-size: 12px;
  }
  .legend-item { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
  .legend-swatch {
    width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
    border: 1px solid var(--soft-line);
  }
  .legend-swatch.is-focus    { background: var(--green); border-color: var(--green); }
  .legend-swatch.is-alert    { background: var(--citron); border-color: var(--carbon); }
  .legend-swatch.is-personal { background: var(--soft-bg); border-color: var(--soft-line); }
  .legend-swatch.is-ops      {
    background: var(--soft-bg); border: 1px dashed var(--soft-line);
    box-shadow: inset 0 0 0 9999px rgba(35, 37, 38, 0.06);
  }
  [data-theme="dark"] .legend-swatch.is-ops { box-shadow: inset 0 0 0 9999px rgba(246, 245, 240, 0.06); }

  /* ========== CALENDAR ========== */
  .calendar-wrap { padding: 22px 32px 36px; }
  .calendar {
    background: var(--page-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
  }

  /* Day header */
  .cal-header {
    display: grid; grid-template-columns: 72px repeat(5, 1fr);
    border-bottom: 1px solid var(--line);
    background: var(--page-bg);
  }
  .cal-header-cell {
    padding: 14px 12px; text-align: left;
    border-left: 1px solid var(--line-soft);
  }
  .cal-header-cell:first-child { border-left: none; }
  .cal-header-cell .dow-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink);
  }
  .cal-header-cell .dow-theme {
    font-family: 'Domine', serif;
    font-size: 15px; font-weight: 500; margin-top: 3px;
    color: var(--ink);
  }
  .cal-header-cell.is-today .dow-name { color: var(--ink); }
  .cal-header-cell.is-today .dow-name .today-mark { background-image: linear-gradient(to top, var(--amber) 0.26em, transparent 0.26em); }

  /* Calendar body */
  .cal-body {
    position: relative;
    display: grid; grid-template-columns: 72px repeat(5, 1fr);
  }
  .cal-time-col { display: flex; flex-direction: column; user-select: none; }
  .cal-time-slot {
    height: 30px;
    padding: 2px 10px 0 0; text-align: right;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--ink); opacity: 0.55;
    border-top: 1px solid var(--line-soft);
  }
  .cal-time-slot.hour-line {
    border-top: 1px solid var(--line-hour);
    opacity: 0.85;
  }
  .cal-time-slot .hour-label { display: none; }
  .cal-time-slot.hour-line .hour-label { display: inline; }

  .cal-day-col {
    position: relative;
    border-left: 1px solid var(--line-soft);
  }
  .cal-day-col .row-line {
    height: 30px;
    border-top: 1px solid var(--line-soft);
  }
  .cal-day-col .row-line.hour-line { border-top: 1px solid var(--line-hour); }

  /* "Now" line (current time, only on today's column) */
  .now-line {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 2px solid var(--amber); z-index: 4; pointer-events: none;
  }
  .now-line::before {
    content: ''; position: absolute; left: -5px; top: -5px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--amber);
  }

  /* ========== SLOT (calendar block) ========== */
  .slot {
    position: absolute; left: 3px; right: 3px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: grab;
    overflow: hidden;
    user-select: none;
    transition: box-shadow 0.12s;
    z-index: 2;
  }
  .slot:hover { box-shadow: 0 3px 12px var(--shadow); z-index: 3; }
  .slot.is-dragging { cursor: grabbing; opacity: 0.92; z-index: 6; box-shadow: 0 10px 24px var(--shadow-up); }
  .slot.is-editing { box-shadow: 0 0 0 2px var(--amber); z-index: 5; }

  .slot-title {
    font-family: 'Domine', serif; font-weight: 600;
    font-size: 14px; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .slot-notes {
    font-size: 11px; opacity: 0.85; margin-top: 5px; line-height: 1.45;
    white-space: pre-wrap;     /* preserve the user's Enter/newlines */
    word-break: break-word;
    overflow: hidden;          /* the slot's own height clips overflow */
  }
  .slot.is-compact .slot-notes { display: none; }
  .slot.is-compact { padding: 4px 10px; }
  .slot.is-compact .slot-title { font-size: 12.5px; -webkit-line-clamp: 1; }

  /* Visual variants — embody design system.
     - focus: deep work block, Dark Green
     - alert: meeting, Citron
     - personal: solid Porcelain card (or Carbon in dark)
     - ops: subtly recessed card, signals "supporting work, not deep focus" */
  .v-focus    { background: var(--green);   color: var(--porcelain); }
  .v-alert    { background: var(--citron);  color: var(--carbon);    border: 1px solid var(--carbon); }
  .v-personal { background: var(--soft-bg); color: var(--soft-ink);  border: 1px solid var(--soft-line); }
  .v-ops      {
    background: var(--soft-bg);
    color: var(--soft-ink);
    border: 1px dashed var(--soft-line);
    box-shadow: inset 0 0 0 9999px rgba(35, 37, 38, 0.06);
  }
  [data-theme="dark"] .v-ops {
    box-shadow: inset 0 0 0 9999px rgba(246, 245, 240, 0.06);
  }

  /* Resize handle at bottom of every slot */
  .slot-resize {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 8px;
    cursor: ns-resize;
  }
  .slot-resize::after {
    content: ''; position: absolute; left: 50%; bottom: 2px;
    transform: translateX(-50%);
    width: 22px; height: 2px;
    background: currentColor; opacity: 0.35; border-radius: 1px;
  }
  .slot:hover .slot-resize::after { opacity: 0.65; }

  /* ========== MODAL ========== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(35, 37, 38, 0.55);
    z-index: 200; display: none;
    align-items: center; justify-content: center; padding: 18px;
  }
  [data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.7); }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--page-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    width: 100%; max-width: 480px;
    overflow: hidden;
  }
  .modal-header {
    padding: 22px 26px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header .eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .modal-header h2 { font-size: 22px; margin-top: 4px; }
  .modal-close {
    background: transparent; border: none; cursor: pointer;
    font-size: 22px; line-height: 1; color: var(--ink);
    width: 32px; height: 32px; border-radius: 50%;
  }
  .modal-close:hover { background: var(--citron); color: var(--carbon); }
  .modal-body {
    padding: 6px 26px 22px;
    display: flex; flex-direction: column; gap: 16px;
    max-height: 70vh; overflow-y: auto;
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
  }
  .field input, .field select, .field textarea {
    background: var(--page-bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
  }
  [data-theme="dark"] .field input[type="time"] { color-scheme: dark; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: 2px solid var(--amber); outline-offset: -1px;
  }
  .field textarea { resize: vertical; min-height: 84px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .modal-footer {
    padding: 16px 26px 22px;
    border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-wrap: wrap;
  }
  .modal-footer .group { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ========== FOOTER NOTES ========== */
  .helper-note {
    padding: 0 32px 18px;
    font-size: 12.5px; color: var(--ink); opacity: 0.7;
    max-width: 760px;
  }
  .helper-note .hl {
    background: var(--amber); color: var(--carbon); padding: 1px 6px; border-radius: 3px;
    font-weight: 600;
  }
  .data-source {
    text-align: center; padding: 16px 32px 32px;
    font-size: 11px; color: var(--ink); opacity: 0.5;
    letter-spacing: 0.05em;
  }
</style>
</head>

(function () {
  var sb = document.getElementById('ksb');

  sb.querySelectorAll('.ksb-head').forEach(function (h) {
    h.addEventListener('click', function () { h.parentElement.classList.toggle('ksb-closed'); });

  var f = (location.pathname.split('/').pop() || '').replace('.html', '');

  if (a) a.classList.add('ksb-active');
})();
</script>

// ============================================================
// STATE
// ============================================================
const State = { slots: [], saveTimer: null, isSaving: false, editingId: null };

// Undo history — snapshots of State.slots taken BEFORE each mutation.
const History = { stack: [], max: 40 };
function snapshot() {
  // Deep clone the slots before any change. Keeps undo cheap and correct.
  History.stack.push(JSON.parse(JSON.stringify(State.slots)));
  if (History.stack.length > History.max) History.stack.shift();
  updateUndoButton();
}
function undo() {
  if (!History.stack.length) return;
  State.slots = History.stack.pop();
  closeModal();
  renderBody();
  queueSave();
  updateUndoButton();
}
function updateUndoButton() {
  const btn = document.getElementById('undoBtn');
  if (btn) btn.disabled = History.stack.length === 0;
}

// In-progress drag/resize state
const Drag = {
  mode: null,          // 'move' | 'resize' | null
  slotId: null,
  startX: 0, startY: 0,
  origStart: null, origEnd: null, origDay: null,
  active: false,
  bodyRect: null,
  colGeom: [],         // [{ day, left, right }]
  previewStart: null, previewEnd: null, previewDay: null,
};

// ============================================================
// SUPABASE
// ============================================================

async function loadFromSupabase() {
  setSaveStatus('Loading');
  try {
    const resp = await fetch(SUPABASE_URL + '/rest/v1/diary_state?id=eq.1&select=slots', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const rows = await resp.json();
    const remoteSlots = (rows[0] && Array.isArray(rows[0].slots)) ? rows[0].slots : [];

    if (remoteSlots.length === 0) {
      // Brand new row — seed with defaults.
      State.slots = cloneDefaults();
      await saveToSupabase();
    } else if (looksLikeV1(remoteSlots)) {
      // Only v1 categories trigger a full reset. v2/v3 user edits are preserved.
      State.slots = cloneDefaults();
      await saveToSupabase();
    } else {
      State.slots = remoteSlots.map(ensureId);
      // Non-destructive migrations: keep all user customisations, just rename old fields.
      let migrated = false;
      if (addMissingThursdayRituals()) migrated = true;  // v2.1 — wake/meditate on Thursday
      if (renameLegacyCategories())    migrated = true;  // v3 — admin→ops, meal→personal
      if (migrated) await saveToSupabase();
    }
    setSaveStatus('Saved', 'saved');
  } catch (err) {
    console.error('loadFromSupabase failed:', err);
    setSaveStatus('Offline — using defaults', 'error');
    State.slots = cloneDefaults();
  }
}

// v1 used bare category IDs ('operations', 'meta-ads', 'amazon'). v2+ uses prefixed IDs
// ('work-amazon', 'work-meta'). Anchor with ^...$ so we don't wrongly match v2/v3 IDs.
function looksLikeV1(slots) {
  const v1Re = /^(operations|meta-ads|organic|amazon|google|website|email-claude|lunch|other)$/;
  return slots.some(s => v1Re.test(s.category || ''));
}

// v2.1 migration: ensure Thursday has Wake up + Meditate.
function addMissingThursdayRituals() {
  const want = [
    { start: '07:00', end: '07:30', title: 'Wake up' },
    { start: '07:30', end: '08:00', title: 'Meditate' },
  ];
  let changed = false;
  for (const w of want) {
    const exists = State.slots.some(s => s.day === 4 && s.start === w.start);
    if (!exists) {
      State.slots.push(ensureId({ day: 4, start: w.start, end: w.end, category: 'personal', title: w.title, notes: '' }));
      changed = true;
    }
  }
  return changed;
}

// v3 migration: 'admin' and 'meal' categories collapsed into 'ops' and 'personal' respectively.
function renameLegacyCategories() {
  let changed = false;
  for (const s of State.slots) {
    if (s.category === 'admin') { s.category = 'ops';      changed = true; }
    else if (s.category === 'meal')  { s.category = 'personal'; changed = true; }
  }
  return changed;
}

async function saveToSupabase() {
  if (State.isSaving) return;
  State.isSaving = true;
  setSaveStatus('Saving', 'saving');
  try {
    const resp = await fetch(SUPABASE_URL + '/rest/v1/diary_state?id=eq.1', {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ slots: State.slots }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    setSaveStatus('Saved', 'saved');
  } catch (err) {
    console.error('saveToSupabase failed:', err);
    setSaveStatus('Save failed', 'error');
  } finally {
    State.isSaving = false;
  }
}

function queueSave() {
  if (State.saveTimer) clearTimeout(State.saveTimer);
  setSaveStatus('Saving', 'saving');
  State.saveTimer = setTimeout(saveToSupabase, 450);
}

function setSaveStatus(text, cls) {
  const el = document.getElementById('saveStatus');
  el.textContent = text;
  el.className = 'save-status' + (cls ? ' ' + cls : '');
}

// ============================================================
// HELPERS
// ============================================================

function cloneDefaults() { return DEFAULT_SLOTS.map(s => ensureId({ ...s })); }
function ensureId(slot)  { if (!slot.id) slot.id = 'slot_' + Math.random().toString(36).slice(2, 10); return slot; }
function timeToMinutes(t) { const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); }
function minutesToTime(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function minutesToPx(min) { return (min - DAY_START_HOUR * 60) * PX_PER_MINUTE; }
function escapeHtml(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function fmtTime12(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h < 12 ? 'am' : 'pm';
  const h12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
  return h12 + ':' + String(m).padStart(2, '0') + ampm;
}
function formatHourLabel(h) {
  const ampm = h < 12 ? 'am' : 'pm';
  const h12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
  return h12 + ampm;
}

// ============================================================
// RENDER
// ============================================================

function renderHeader() {
  const header = document.getElementById('calHeader');
  const todayDow = new Date().getDay(); // 0 Sun … 6 Sat
  const todayMon1 = todayDow === 0 ? 7 : todayDow;
  let html = '<div class="cal-header-cell"></div>';
  for (let d = 1; d <= 5; d++) {
    const isToday = d === todayMon1;
    html += `<div class="cal-header-cell ${isToday ? 'is-today' : ''}">
      <div class="dow-name">${isToday ? `<span class="today-mark">${DAY_NAMES[d-1]}</span>` : DAY_NAMES[d-1]}</div>
      <div class="dow-theme">${escapeHtml(DAY_THEMES[d])}</div>
    </div>`;
  }
  header.innerHTML = html;
}

function renderBody() {
  const body = document.getElementById('calBody');
  const totalMin = (DAY_END_HOUR - DAY_START_HOUR) * 60;
  const totalRows = totalMin / SLOT_MINUTES;
  const bodyHeight = totalMin * PX_PER_MINUTE;

  // Time column
  let html = '<div class="cal-time-col" style="height:' + bodyHeight + 'px">';
  for (let i = 0; i < totalRows; i++) {
    const min = DAY_START_HOUR * 60 + i * SLOT_MINUTES;
    const isHour = (min % 60) === 0;
    const h = Math.floor(min / 60);
    html += `<div class="cal-time-slot${isHour ? ' hour-line' : ''}"><span class="hour-label">${formatHourLabel(h)}</span></div>`;
  }
  html += '</div>';

  // 5 day columns
  for (let d = 1; d <= 5; d++) {
    html += `<div class="cal-day-col" data-day="${d}" style="height:${bodyHeight}px">`;
    for (let i = 0; i < totalRows; i++) {
      const min = DAY_START_HOUR * 60 + i * SLOT_MINUTES;
      const isHour = (min % 60) === 0;
      html += `<div class="row-line${isHour ? ' hour-line' : ''}"></div>`;
    }
    // Slots on this day, sorted by start (for stable z-stacking)
    const slotsForDay = State.slots.filter(s => s.day === d).slice().sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
    for (const slot of slotsForDay) {
      html += renderSlot(slot);
    }
    html += '</div>';
  }
  body.innerHTML = html;

  // Wire slot interactions
  body.querySelectorAll('.slot').forEach(el => {
    el.addEventListener('mousedown', onSlotMouseDown);
    el.addEventListener('touchstart', onSlotTouchStart, { passive: false });
  });

  drawNowLine();
}

function renderSlot(slot) {
  const cat = categoryById(slot.category);
  const startMin = timeToMinutes(slot.start);
  const endMin = timeToMinutes(slot.end);
  const top = minutesToPx(startMin);
  const height = Math.max(20, (endMin - startMin) * PX_PER_MINUTE - 2);
  const isCompact = height < COMPACT_HEIGHT_PX;
  const editingCls = State.editingId === slot.id ? ' is-editing' : '';
  const compactCls = isCompact ? ' is-compact' : '';
  // Time text is suppressed in the block — the left axis already labels every row.
  const notes = (slot.notes && !isCompact) ? `<div class="slot-notes">${escapeHtml(slot.notes)}</div>` : '';
  return `
    <div class="slot v-${cat.variant}${editingCls}${compactCls}" data-id="${slot.id}" style="top:${top}px;height:${height}px">
      <div class="slot-title">${escapeHtml(slot.title)}</div>
      ${notes}
      <div class="slot-resize" data-resize="1"></div>
    </div>`;
}

function drawNowLine() {
  // Add a thin amber line at the current time on today's column.
  const todayDow = new Date().getDay();
  const todayMon1 = todayDow === 0 ? 7 : todayDow;
  if (todayMon1 < 1 || todayMon1 > 5) return; // weekend — skip
  const now = new Date();
  const minNow = now.getHours() * 60 + now.getMinutes();
  if (minNow < DAY_START_HOUR * 60 || minNow > DAY_END_HOUR * 60) return;
  const col = document.querySelector(`.cal-day-col[data-day="${todayMon1}"]`);
  if (!col) return;
  const top = minutesToPx(minNow);
  const line = document.createElement('div');
  line.className = 'now-line';
  line.style.top = top + 'px';
  col.appendChild(line);
}

// ============================================================
// DRAG / RESIZE
// ============================================================

function onSlotMouseDown(e) {
  if (e.button !== 0) return;
  const slotEl = e.currentTarget;
  startDrag(slotEl, e.clientX, e.clientY, e.target && e.target.dataset && e.target.dataset.resize === '1');
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
  e.preventDefault();
}

function onSlotTouchStart(e) {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  const slotEl = e.currentTarget;
  startDrag(slotEl, t.clientX, t.clientY, e.target && e.target.dataset && e.target.dataset.resize === '1');
  document.addEventListener('touchmove', onDragTouchMove, { passive: false });
  document.addEventListener('touchend', onDragEnd);
  e.preventDefault();
}

function startDrag(slotEl, clientX, clientY, isResize) {
  const id = slotEl.dataset.id;
  const slot = State.slots.find(s => s.id === id);
  if (!slot) return;
  Drag.mode = isResize ? 'resize' : 'move';
  Drag.slotId = id;
  Drag.startX = clientX;
  Drag.startY = clientY;
  Drag.origStart = slot.start;
  Drag.origEnd = slot.end;
  Drag.origDay = slot.day;
  Drag.active = false;
  Drag.previewStart = null;
  Drag.previewEnd = null;
  Drag.previewDay = null;

  // Measure body + columns for cross-day drag
  const body = document.getElementById('calBody');
  Drag.bodyRect = body.getBoundingClientRect();
  Drag.colGeom = Array.from(body.querySelectorAll('.cal-day-col')).map(el => {
    const r = el.getBoundingClientRect();
    return { day: parseInt(el.dataset.day, 10), left: r.left, right: r.right };
  });

  slotEl.classList.add('is-dragging');
}

function onDragTouchMove(e) {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  onDragMove({ clientX: t.clientX, clientY: t.clientY, preventDefault: () => e.preventDefault() });
  e.preventDefault();
}

function onDragMove(e) {
  if (!Drag.mode) return;
  const dx = e.clientX - Drag.startX;
  const dy = e.clientY - Drag.startY;
  if (!Drag.active && Math.abs(dx) + Math.abs(dy) > 4) Drag.active = true;
  if (!Drag.active) return;

  const slotEl = document.querySelector(`.slot[data-id="${Drag.slotId}"]`);
  if (!slotEl) return;

  const minutesDelta = Math.round(dy / PX_PER_MINUTE / SNAP_MINUTES) * SNAP_MINUTES;

  if (Drag.mode === 'move') {
    const origStartMin = timeToMinutes(Drag.origStart);
    const origEndMin = timeToMinutes(Drag.origEnd);
    const dur = origEndMin - origStartMin;
    let newStart = origStartMin + minutesDelta;
    let newEnd = newStart + dur;
    // Clamp within visible day
    const dayMin = DAY_START_HOUR * 60;
    const dayMax = DAY_END_HOUR * 60;
    if (newStart < dayMin) { newStart = dayMin; newEnd = newStart + dur; }
    if (newEnd > dayMax)   { newEnd = dayMax;   newStart = newEnd - dur; }

    slotEl.style.top = minutesToPx(newStart) + 'px';
    slotEl.style.height = (newEnd - newStart) * PX_PER_MINUTE - 2 + 'px';
    Drag.previewStart = minutesToTime(newStart);
    Drag.previewEnd = minutesToTime(newEnd);

    // Detect day column
    const col = Drag.colGeom.find(c => e.clientX >= c.left && e.clientX < c.right);
    const newDay = col ? col.day : Drag.origDay;
    if (newDay !== parseInt(slotEl.parentElement.dataset.day, 10)) {
      const newColEl = document.querySelector(`.cal-day-col[data-day="${newDay}"]`);
      if (newColEl) newColEl.appendChild(slotEl);
    }
    Drag.previewDay = newDay;
  }
  else if (Drag.mode === 'resize') {
    const slot = State.slots.find(s => s.id === Drag.slotId);
    const startMin = timeToMinutes(slot.start);
    const origEndMin = timeToMinutes(Drag.origEnd);
    let newEnd = origEndMin + minutesDelta;
    if (newEnd < startMin + 15) newEnd = startMin + 15;
    if (newEnd > DAY_END_HOUR * 60) newEnd = DAY_END_HOUR * 60;
    slotEl.style.height = (newEnd - startMin) * PX_PER_MINUTE - 2 + 'px';
    Drag.previewEnd = minutesToTime(newEnd);
  }
}

function onDragEnd() {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  document.removeEventListener('touchmove', onDragTouchMove);
  document.removeEventListener('touchend', onDragEnd);
  if (!Drag.mode) return;

  const slotEl = document.querySelector(`.slot[data-id="${Drag.slotId}"]`);
  if (slotEl) slotEl.classList.remove('is-dragging');

  if (Drag.active) {
    const slot = State.slots.find(s => s.id === Drag.slotId);
    if (slot) {
      // Only snapshot if something actually changed.
      const changed =
        (Drag.previewStart && Drag.previewStart !== slot.start) ||
        (Drag.previewEnd   && Drag.previewEnd   !== slot.end)   ||
        (Drag.previewDay   && Drag.previewDay   !== slot.day);
      if (changed) {
        snapshot();
        if (Drag.previewStart) slot.start = Drag.previewStart;
        if (Drag.previewEnd)   slot.end   = Drag.previewEnd;
        if (Drag.previewDay)   slot.day   = Drag.previewDay;
        queueSave();
      }
    }
    renderBody();
  } else {
    // Treat as click
    openEdit(Drag.slotId);
  }
  // Reset
  Drag.mode = null;
  Drag.slotId = null;
  Drag.active = false;
}

function openEdit(slotId) {
  const slot = State.slots.find(s => s.id === slotId);
  if (!slot) return;
  State.editingId = slot.id;
  document.getElementById('modalEyebrow').textContent = 'Edit block';
  document.getElementById('modalTitle').textContent = slot.title || 'Block';
  document.getElementById('fldTitle').value = slot.title || '';
  document.getElementById('fldCategory').value = slot.category;
  document.getElementById('fldDay').value = String(slot.day);
  document.getElementById('fldStart').value = slot.start;
  document.getElementById('fldEnd').value = slot.end;
  document.getElementById('fldNotes').value = slot.notes || '';
  document.getElementById('deleteBtn').style.display = '';
  document.getElementById('modalOverlay').classList.add('open');
  renderBody();
  setTimeout(() => document.getElementById('fldTitle').focus(), 50);
}

function openCreate() {
  const newId = 'slot_' + Math.random().toString(36).slice(2, 10);
  State.editingId = newId;
  document.getElementById('modalEyebrow').textContent = 'Add block';
  document.getElementById('modalTitle').textContent = 'New block';
  document.getElementById('fldTitle').value = '';
  document.getElementById('fldCategory').value = 'work-other';
  document.getElementById('fldDay').value = '1';
  document.getElementById('fldStart').value = '12:00';
  document.getElementById('fldEnd').value = '13:00';
  document.getElementById('fldNotes').value = '';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fldTitle').focus(), 50);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  State.editingId = null;
  renderBody();
}

function saveModal() {
  const id = State.editingId;
  if (!id) return;
  const title    = document.getElementById('fldTitle').value.trim() || 'Untitled';
  const category = document.getElementById('fldCategory').value;
  const day      = parseInt(document.getElementById('fldDay').value, 10);
  const start    = document.getElementById('fldStart').value;
  const end      = document.getElementById('fldEnd').value;
  const notes    = document.getElementById('fldNotes').value;

  if (!start || !end) { alert('Pick a start and end time.'); return; }
  if (timeToMinutes(end) <= timeToMinutes(start)) { alert('End time must be after start time.'); return; }

  snapshot();
  const existing = State.slots.find(s => s.id === id);
  if (existing) Object.assign(existing, { title, category, day, start, end, notes });
  else          State.slots.push({ id, title, category, day, start, end, notes });

  closeModal();
  renderBody();
  queueSave();
}

function deleteSlot() {
  if (!State.editingId) return;
  if (!confirm('Delete this block? You can undo with ⌘Z.')) return;
  snapshot();
  State.slots = State.slots.filter(s => s.id !== State.editingId);
  closeModal();
  renderBody();
  queueSave();
}

const SUN_ICON  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

function applyTheme(theme) {
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else                  document.documentElement.removeAttribute('data-theme');
  const icon = document.getElementById('themeIcon');
  if (icon) icon.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
}
function initTheme() {
  const saved = localStorage.getItem('karmicDiaryTheme');
  const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('karmicDiaryTheme', next);
}

// Refresh from Supabase when the tab regains focus, so edits made elsewhere
// (other devices, direct SQL, the user's other tab) don't get clobbered by a
// stale save. Skip if we have a pending local save so we don't lose unsaved work.
function bindVisibilityRefresh() {
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    if (State.saveTimer || State.isSaving) return; // local edits in flight, don't clobber
    if (document.getElementById('modalOverlay').classList.contains('open')) return; // user is editing
    try {
      const resp = await fetch(SUPABASE_URL + '/rest/v1/diary_state?id=eq.1&select=slots', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      });
      if (!resp.ok) return;
      const rows = await resp.json();
      const remoteSlots = (rows[0] && Array.isArray(rows[0].slots)) ? rows[0].slots : null;
      if (!remoteSlots) return;
      // Only re-render if the remote has actually changed.
      const local = JSON.stringify(State.slots);
      const remote = JSON.stringify(remoteSlots);
      if (local === remote) return;
      State.slots = remoteSlots.map(ensureId);
      renderBody();
    } catch (e) { /* offline — keep showing what we have */ }
  });
}

function bindGlobalEvents() {
  document.getElementById('addBtn').addEventListener('click', openCreate);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', saveModal);
  document.getElementById('deleteBtn').addEventListener('click', deleteSlot);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); return; }
    // Cmd/Ctrl + Z = Undo. Only when no modal/input is active.
    if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
      const tag = (e.target && e.target.tagName) || '';
      const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (!inField) { e.preventDefault(); undo(); }
    }
  });
  // Refresh now-line every minute
  setInterval(() => {
    const existing = document.querySelector('.now-line');
    if (existing) existing.remove();
    drawNowLine();
  }, 60 * 1000);
}

async function init() {
  initTheme();
  populateCategorySelect();
  bindGlobalEvents();
  bindVisibilityRefresh();
  renderHeader();
  await loadFromSupabase();
  renderBody();
}

init();
</script>
