<style>
  /* ========== TOKENS ==========
     Palette and type come from design-system.html, mapped the same way as inventory.html:
     six colours only, all text Carbon Black, hierarchy from size and weight, content
     separated by space and background tone, borders only on things a user interacts with.
     On this page: Dark Green is the activity bar, Citron is a finished bar, Amber marks
     today and anything at risk, Carbon is the milestone diamond. */
  :root {
    /* Brand palette */
    --porcelain: #F6F5F0;   /* background, default      */
    --citron:    #CAD183;   /* background, section tint */
    --carbon:    #232526;   /* text, icons and borders  */
    --green:     #2F5350;   /* branded background       */
    --red:       #B22222;   /* main action button       */
    --amber:     #EFA71D;   /* highlight mark           */

    /* Typography */
    --font-heading: 'Domine', Georgia, serif;
    --font-body:    'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    /* Mapped tokens */
    --ground:    var(--porcelain);   /* page and tiles                      */
    --tint:      var(--citron);      /* finished bars                       */
    --ink:       var(--carbon);      /* all text, icons, borders, diamonds  */
    --panel:     var(--green);       /* activity bars                       */
    --panel-ink: var(--porcelain);
    --mark:      var(--amber);       /* today line, at-risk badge           */
    --mark-ink:  var(--carbon);
    --btn-fill:  var(--carbon);      /* secondary button fill               */
    --btn-ink:   var(--porcelain);
    --neutral-soft:   rgba(35,37,38,0.10);   /* Planned pill: Carbon at low opacity      */
    --neutral-strong: rgba(35,37,38,0.24);   /* Not started pill: the same, stronger     */
    --grid-half:  rgba(35,37,38,0.10);   /* half-month gridline, Carbon at low opacity */
    --grid-month: rgba(35,37,38,0.28);   /* month gridline                              */
    --label-w: 320px;
    --notes-w: 200px;
    --cell-w: 48px;        /* minimum width of one half-month; the Gantt scrolls sideways beyond the page */
  }
  [data-theme="dark"] {
    --ground: #0f1117; --tint: #1e1e22; --ink: #f4f4f5;
    --btn-fill: #f4f4f5; --btn-ink: #0f1117;
    --panel: #34d399; --panel-ink: #0f1117;
    --grid-half: rgba(244,244,245,0.08); --grid-month: rgba(244,244,245,0.22);
    --neutral-soft: rgba(244,244,245,0.12); --neutral-strong: rgba(244,244,245,0.28);
  }

  /* ========== BASE ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--ground); color: var(--ink); min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background 0.2s, color 0.2s; overflow-x: hidden; }   /* only the timeline scrolls sideways, never the page */
  h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 600; line-height: 1.2; color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  strong, b { font-weight: 700; }
  select, input, button { font-family: var(--font-body); color: var(--ink); }

  /* ========== LAYOUT ========== */
  /* Full width: a timeline earns its width, so the page keeps only a 32px gutter either side. */
  .wrap { padding: 0 clamp(16px, 3vw, 32px); }
  .section { padding-top: 24px; padding-bottom: 64px; }
  .section-head { margin-bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .section-title { font-size: 24px; margin-top: 8px; }

  /* ========== HEADER ========== */
  .header { position: sticky; top: 0; z-index: 10; background: var(--ground); }   /* above the Gantt, below the fixed sidebar (z 40) */
  .header .wrap { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding-top: 16px; padding-bottom: 12px; }
  .header h1 { font-size: 24px; margin-top: 4px; display: inline-block; margin-right: 12px; }
  .save-status { font-size: 12px; font-weight: 500; white-space: nowrap; display: none; }
  body.editing .save-status, .save-status.error { display: inline; }
  .header-right { display: flex; align-items: center; gap: 8px; }

  /* ========== BUTTONS ========== */
  .btn { font-family: var(--font-body); font-weight: 600; font-size: 13px; line-height: 1; padding: 8px 16px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: filter 0.15s, background 0.15s, color 0.15s; }
  .btn svg { width: 14px; height: 14px; display: block; }
  .btn-secondary { background: var(--btn-fill); color: var(--btn-ink); border: 1.5px solid var(--btn-fill); }
  .btn-secondary:hover { filter: brightness(0.9); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn-ghost:hover { background: var(--btn-fill); color: var(--btn-ink); }
  .btn-small { font-size: 12px; padding: 8px 12px; }
  .theme-toggle { padding: 8px; }
  .theme-toggle svg { width: 16px; height: 16px; fill: currentColor; }

  /* ========== EDIT TOOLBAR (visible in edit mode only) ========== */
  .toolbar { display: none; align-items: center; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 24px; }
  body.editing .toolbar { display: flex; }
  .field { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
  /* Compact inline selects carry the 6px pill radius (same as the inventory toggles); typed fields carry the 12px input radius. */
  .ctl { font-size: 12px; font-weight: 500; color: var(--ink); background: var(--ground); border: 1px solid var(--ink); border-radius: 6px; padding: 4px 8px; line-height: 1.5; }
  .ctl:focus-visible, .g-edit input:focus-visible, .g-notes textarea:focus-visible, .check input:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .check input { accent-color: var(--btn-fill); width: 16px; height: 16px; cursor: pointer; }

  /* ========== GANTT ========== */
  /* Two panes: the left one (#, Activity, Notes) never moves sideways; the right one is the only thing that
     scrolls sideways. The column headers sit in their own block that stays pinned under the page header
     while the page scrolls; its month row mirrors the timeline's horizontal position.
     Row heights are kept equal across the panes by syncRowHeights(). */
  .g-sticky { position: sticky; top: var(--header-h, 76px); z-index: 5; background: var(--ground); display: flex; align-items: flex-end; transition: box-shadow 0.2s; }
  .g-sticky.raised { box-shadow: 0 8px 24px -12px rgba(35,37,38,0.35); }   /* rows pass beneath the frozen headers */
  [data-theme="dark"] .g-sticky.raised { box-shadow: 0 8px 24px -12px rgba(0,0,0,0.7); }
  .g-hscroll { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .g-panes { display: flex; align-items: flex-start; }
  .g-fixed, .g-sticky > .g-row { flex: 0 0 calc(var(--label-w) + var(--notes-w)); width: calc(var(--label-w) + var(--notes-w)); }
  .g-scroll { flex: 1 1 auto; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; }
  .g-track { min-width: calc(var(--ncols) * var(--cell-w)); }
  body.editing .gantt { --label-w: 380px; --notes-w: 220px; }
  .g-row { display: flex; align-items: stretch; }
  .g-label { flex: 0 0 var(--label-w); width: var(--label-w); padding: 12px 16px 12px 0; display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
  .g-notes { flex: 0 0 var(--notes-w); width: var(--notes-w); padding: 12px 16px 12px 0; min-width: 0; font-size: 12px; font-weight: 400; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .g-notes textarea { display: none; width: 100%; min-height: 64px; resize: vertical; font-size: 12px; font-weight: 400; line-height: 1.45; padding: 8px 12px; border: 1px solid var(--ink); border-radius: 12px; background: var(--ground); color: var(--ink); }
  body.editing .g-notes .g-notes-text { display: none; }
  body.editing .g-notes textarea { display: block; }
  .g-time { flex: 1 1 auto; position: relative; min-height: 48px;
    background-image: linear-gradient(to right, var(--grid-month) 1px, transparent 1px), linear-gradient(to right, var(--grid-half) 1px, transparent 1px);
    background-size: calc(200% / var(--ncols)) 100%, calc(100% / var(--ncols)) 100%; }

  /* Header row: month names, each spanning two half-month cells */
  .g-head .g-label, .g-head .g-notes { padding-bottom: 12px; display: flex; align-items: flex-end; }
  .g-head .g-time { display: flex; min-height: 0; background: none; padding-top: 24px; }   /* room for the Today badge above the month names */
  .g-month { flex: 0 0 calc(200% / var(--ncols)); width: calc(200% / var(--ncols)); min-width: 0; text-align: center; padding-bottom: 6px; }
  .g-month .m-name { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .g-month .m-ticks { display: flex; margin-top: 2px; }
  .g-month .m-ticks span { flex: 1; text-align: left; padding-left: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }
  .g-head-cols { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  /* Body: rows separated by space, not rules */
  .g-body { position: relative; }
  .g-empty { padding: 24px 0; font-size: 14px; }

  /* Label column, view mode */
  .g-num { flex: 0 0 32px; font-size: 12px; font-weight: 700; padding-top: 2px; }
  .g-view { min-width: 0; flex: 1; }
  .g-name { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .g-meta { font-size: 11px; font-weight: 500; margin-top: 3px; letter-spacing: 0.04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 2px 8px; border-radius: 100px; background: var(--mark); color: var(--mark-ink); }
  .badge.tint { background: var(--tint); color: var(--ink); }   /* In progress: Citron behind Carbon text */
  .badge.neutral { background: var(--neutral-soft); color: var(--ink); }      /* Planned: start date still ahead of today */
  .badge.neutral.strong { background: var(--neutral-strong); }               /* Not started: today has reached the start */

  /* Label column, edit mode */
  .g-edit { display: none; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  body.editing .g-view { display: none; }
  body.editing .g-edit { display: flex; }
  .g-edit input[type="text"] { width: 100%; font-size: 13px; font-weight: 600; padding: 8px 12px; border: 1px solid var(--ink); border-radius: 12px; background: var(--ground); color: var(--ink); }
  .g-edit .erow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .g-edit .ctl { padding: 4px 8px; font-size: 11px; }
  .g-edit .check { font-size: 11px; }
  body.editing .g-body .g-num { flex-basis: 52px; }
  .g-num select.ctl { width: 100%; padding: 4px 0 4px 4px; font-weight: 700; font-size: 12px; }
  .rm { background: none; border: none; color: var(--ink); font-size: 11px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 0; margin-left: auto; }
  .rm:hover { opacity: 0.7; }

  /* Bars and milestones */
  .bar { position: absolute; top: 50%; transform: translateY(-50%); height: 24px; border-radius: 6px; background: var(--panel); color: var(--panel-ink); font-size: 11px; font-weight: 600; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; user-select: none; z-index: 1; }
  .bar.done { background: var(--tint); color: var(--ink); }
  .bar .h { position: absolute; top: 0; bottom: 0; width: 10px; display: none; cursor: ew-resize; }
  .bar .h.l { left: 0; } .bar .h.r { right: 0; }
  body.editing .bar { cursor: grab; }
  body.editing .bar.dragging { cursor: grabbing; filter: brightness(1.08); }
  body.editing .bar .h { display: block; }
  .ms { position: absolute; top: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%) rotate(45deg); background: var(--ink); border-radius: 2px; z-index: 1; user-select: none; }
  .ms.done { background: var(--tint); box-shadow: inset 0 0 0 2px var(--ink); }
  body.editing .ms { cursor: grab; }
  body.editing .ms.dragging { cursor: grabbing; }

  /* Today: one amber line across every row, with a badge in the header */
  .today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--mark); z-index: 2; pointer-events: none; }
  .today-tag { position: absolute; top: 0; transform: translate(-50%, 0); z-index: 2; pointer-events: none; }

  /* ========== RESPONSIVE ========== */
</style>
</head>

const WORKSTREAMS = ['Product', 'Packaging', 'Compliance', 'Marketing'];
// Names used before 10 Oct 2026, folded into the four above so older saved plans still load.
const LEGACY_WORKSTREAMS = { Content: 'Marketing', Listings: 'Marketing', Operations: 'Product', Launch: 'Marketing' };
const STATUSES = { planned: 'Planned', progress: 'In progress', done: 'Done', risk: 'At risk' };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DEFAULT_RANGE = { from: '2026-10', to: '2027-05' };
const RANGE_OPTIONS = { from: '2026-01', to: '2028-12' };   // what the range dropdowns offer

// ============================================================
// HALF-MONTH HELPERS
// A half-month key is "YYYY-MM-a" (1st to 15th) or "YYYY-MM-b" (15th to month end).
// The 15th is the shared mid-month boundary, so the first half ends on it and the second starts on it.
// Internally every half-month is an integer index so bars can be moved by adding cells.
// ============================================================
function keyToIdx(key) {
  const p = key.split('-');
  return ((+p[0]) * 12 + (+p[1] - 1)) * 2 + (p[2] === 'b' ? 1 : 0);
}
function idxToKey(i) {
  const mi = Math.floor(i / 2), y = Math.floor(mi / 12), m = (mi % 12) + 1;
  return y + '-' + String(m).padStart(2, '0') + '-' + (i % 2 ? 'b' : 'a');
}
function monthKeyToIdx(mk) { const p = mk.split('-'); return (+p[0]) * 12 + (+p[1] - 1); }   // month index
function monthIdxToKey(mi) { return Math.floor(mi / 12) + '-' + String((mi % 12) + 1).padStart(2, '0'); }
function monthIdxLabel(mi) { return MONTHS[mi % 12] + ' ' + String(Math.floor(mi / 12)).slice(2); }   // "Aug 26"
function daysInMonth(y, m1) { return new Date(y, m1, 0).getDate(); }
function idxParts(i) { const mi = Math.floor(i / 2); return { y: Math.floor(mi / 12), m: (mi % 12) + 1, half: i % 2 }; }
function startLabel(i, withYear) { const p = idxParts(i); return (p.half ? 15 : 1) + ' ' + MONTHS[p.m - 1] + (withYear ? ' ' + p.y : ''); }
function endLabel(i, withYear) { const p = idxParts(i); return (p.half ? daysInMonth(p.y, p.m) : 15) + ' ' + MONTHS[p.m - 1] + (withYear ? ' ' + p.y : ''); }
function spanLabel(s, e) {
  const ps = idxParts(s), pe = idxParts(e);
  if (ps.y === pe.y) return startLabel(s, false) + ' to ' + endLabel(e, true);
  return startLabel(s, true) + ' to ' + endLabel(e, true);
}
function halfOptionLabel(i) { return startLabel(i, true); }   // dropdown text: the half's first day
function todayIdx() { const d = new Date(); return (d.getFullYear() * 12 + d.getMonth()) * 2 + (d.getDate() >= 15 ? 1 : 0); }
function todayFloatIdx() {
  const d = new Date();
  return (d.getFullYear() * 12 + d.getMonth()) * 2 + ((d.getDate() - 1) / daysInMonth(d.getFullYear(), d.getMonth() + 1)) * 2;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ============================================================

// Seeded once, when the Supabase row is empty. Tracker-set dates: samples and COGS in

// briefs by 28 Dec, trio live 28 Feb 2027, full range and SPF30 live 30 Apr 2027.
// ============================================================
function defaultTasks() {
  const t = (name, workstream, start, end, status, milestone) => ({ id: uid(), name, workstream, start, end: end || start, status: status || 'planned', milestone: !!milestone, notes: '' });
  return [
    t('Test formula samples and pick the acne moisturiser', 'Product', '2026-10-a', '2026-10-a', 'progress'),

// ============================================================
// STATE
// ============================================================
const State = {
  plan: null,          // { version, range:{from,to}, autoOrder, tasks:[...] }
  editing: false,
  saveTimer: null,
  isSaving: false,
  savePending: false,
  dirty: false,
};
let FROM = 0, TO = 0, NCOLS = 1;   // visible half-month index range, recomputed on render

function normalisePlan(plan) {
  if (!plan || !Array.isArray(plan.tasks)) return null;
  plan.version = 1;
  plan.autoOrder = !!plan.autoOrder;
  plan.range = Object.assign({}, DEFAULT_RANGE, plan.range || {});
  plan.tasks = plan.tasks.filter(t => t && typeof t === 'object').map(t => {
    const task = {
      id: t.id || uid(),
      name: typeof t.name === 'string' ? t.name : 'Untitled activity',
      workstream: WORKSTREAMS.includes(t.workstream) ? t.workstream : (LEGACY_WORKSTREAMS[t.workstream] || WORKSTREAMS[0]),
      start: /^\d{4}-\d{2}-[ab]$/.test(t.start || '') ? t.start : idxToKey(todayIdx()),
      end: /^\d{4}-\d{2}-[ab]$/.test(t.end || '') ? t.end : null,
      status: STATUSES[t.status] ? t.status : 'planned',
      milestone: !!t.milestone,
      notes: typeof t.notes === 'string' ? t.notes : '',
    };
    if (!task.end || keyToIdx(task.end) < keyToIdx(task.start)) task.end = task.start;
    if (task.milestone) task.end = task.start;
    return task;
  });
  fitRange(plan);
  if (plan.autoOrder) sortTasks(plan.tasks);
  return plan;
}

// The visible range always covers every task; it can only be widened beyond that.
function fitRange(plan) {
  let from = monthKeyToIdx(plan.range.from), to = monthKeyToIdx(plan.range.to);
  if (to < from) to = from;
  for (const t of plan.tasks) {
    from = Math.min(from, Math.floor(keyToIdx(t.start) / 2));
    to = Math.max(to, Math.floor(keyToIdx(t.end) / 2));
  }
  plan.range.from = monthIdxToKey(from);
  plan.range.to = monthIdxToKey(to);
}

function sortTasks(tasks) {
  tasks.sort((a, b) => (keyToIdx(a.start) - keyToIdx(b.start)) || (keyToIdx(a.end) - keyToIdx(b.end)));
}

function taskById(id) { return State.plan.tasks.find(t => t.id === id); }

// ============================================================
// SUPABASE
// Single-row JSON state, same pattern as diary.html (diary_state).
// ============================================================
async function loadPlan() {
  setSaveStatus('Loading');
  try {
    const resp = await fetch(STATE_URL + '&select=state', { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const rows = await resp.json();
    const remote = rows[0] ? rows[0].state : null;
    const plan = normalisePlan(remote);
    if (plan) {
      State.plan = plan;
      setSaveStatus('Saved');
    } else {
      // Empty row: seed the default plan and store it.
      State.plan = normalisePlan({ version: 1, range: DEFAULT_RANGE, autoOrder: false, tasks: defaultTasks() });
      await savePlan();
    }
  } catch (err) {
    console.error('loadPlan failed:', err);
    setSaveStatus('Offline: showing the default plan', true);
    State.plan = normalisePlan({ version: 1, range: DEFAULT_RANGE, autoOrder: false, tasks: defaultTasks() });
  }
  render();
}

async function savePlan() {
  if (State.isSaving) { State.savePending = true; return; }
  State.isSaving = true;
  setSaveStatus('Saving');
  try {
    const resp = await fetch(STATE_URL, {
      method: 'PATCH',
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ state: State.plan }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    State.dirty = false;
    setSaveStatus('Saved');
  } catch (err) {
    console.error('savePlan failed:', err);
    setSaveStatus('Save failed. Check the connection and try again.', true);
  } finally {
    State.isSaving = false;
    if (State.savePending) { State.savePending = false; savePlan(); }
  }
}

function queueSave() {
  State.dirty = true;
  if (State.saveTimer) clearTimeout(State.saveTimer);
  setSaveStatus('Saving');
  State.saveTimer = setTimeout(() => { State.saveTimer = null; savePlan(); }, 500);
}

function setSaveStatus(text, isError) {
  const el = document.getElementById('saveStatus');
  el.textContent = text;
  el.classList.toggle('error', !!isError);
}

// Any change to the plan goes through here: re-sort if asked, redraw, save.
function afterChange() {
  if (State.plan.autoOrder) sortTasks(State.plan.tasks);
  fitRange(State.plan);
  render();
  queueSave();
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const plan = State.plan;
  FROM = monthKeyToIdx(plan.range.from) * 2;
  TO = monthKeyToIdx(plan.range.to) * 2 + 1;
  NCOLS = TO - FROM + 1;
  renderToolbar();
  renderGantt();
}

function renderToolbar() {
  const plan = State.plan;
  const from = document.getElementById('rangeFrom'), to = document.getElementById('rangeTo');
  const lo = monthKeyToIdx(RANGE_OPTIONS.from), hi = monthKeyToIdx(RANGE_OPTIONS.to);
  let opts = '';
  for (let mi = lo; mi <= hi; mi++) opts += '<option value="' + monthIdxToKey(mi) + '">' + monthIdxLabel(mi) + '</option>';
  from.innerHTML = opts; to.innerHTML = opts;
  from.value = plan.range.from; to.value = plan.range.to;
  document.getElementById('autoOrder').checked = plan.autoOrder;
}

function renderGantt() {
  const plan = State.plan, g = document.getElementById('gantt');
  g.style.setProperty('--ncols', NCOLS);
  const editing = State.editing;
  const monthFrom = Math.floor(FROM / 2), monthTo = Math.floor(TO / 2);
  const prevScroll = g.querySelector('.g-scroll') ? g.querySelector('.g-scroll').scrollLeft : 0;

  // Header rows, one per pane
  let months = '';
  for (let mi = monthFrom; mi <= monthTo; mi++) {
    months += '<div class="g-month"><div class="m-name">' + monthIdxLabel(mi) + '</div><div class="m-ticks"><span>1</span><span>15</span></div></div>';
  }
  const tf = todayFloatIdx();
  const todayVisible = tf >= FROM && tf <= TO + 1;
  const todayPct = ((tf - FROM) / NCOLS * 100).toFixed(3) + '%';
  const headLeft = '<div class="g-row g-head g-l"><div class="g-label g-head-cols"><span class="g-num">#</span><span>Activity</span></div><div class="g-notes g-head-cols">Notes</div></div>';
  const headRight = '<div class="g-row g-head g-r"><div class="g-time">' + months +
    (todayVisible ? '<span class="today-tag badge" style="left:' + todayPct + '">Today</span>' : '') + '</div></div>';

  // Body rows
  let left = '<div class="g-body">';
  let right = '<div class="g-body">';
  if (!plan.tasks.length) {
    left += '<div class="g-empty">No activities yet. Click Edit plan, then Add activity.</div>';
  }
  plan.tasks.forEach((t, i) => { const r = rowHtml(t, i, editing); left += r.left; right += r.right; });
  if (todayVisible && plan.tasks.length) {
    right += '<div class="today-line" style="left:' + todayPct + '"></div>';
  }
  left += '</div>';
  right += '</div>';
  g.innerHTML =
    '<div class="g-sticky">' + headLeft + '<div class="g-hscroll"><div class="g-track">' + headRight + '</div></div></div>' +
    '<div class="g-panes"><div class="g-fixed">' + left + '</div><div class="g-scroll"><div class="g-track">' + right + '</div></div></div>';

  // The month row follows the timeline sideways; a sideways wheel over the month row drives the timeline.
  const bodyScroll = g.querySelector('.g-scroll'), headScroll = g.querySelector('.g-hscroll');
  bodyScroll.addEventListener('scroll', () => { headScroll.scrollLeft = bodyScroll.scrollLeft; }, { passive: true });
  headScroll.addEventListener('wheel', ev => {
    if (Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) { bodyScroll.scrollLeft += ev.deltaX; ev.preventDefault(); }
  }, { passive: false });
  bodyScroll.scrollLeft = prevScroll;
  headScroll.scrollLeft = prevScroll;
  syncRowHeights();
  watchRowHeights();
  updateStickyShadow();
}

// The two panes are separate columns, so each row is forced to the taller of its two halves.
let syncing = false;
function syncRowHeights() {
  if (syncing) return;
  syncing = true;
  const L = document.querySelectorAll('#gantt .g-row.g-l'), R = document.querySelectorAll('#gantt .g-row.g-r');
  L.forEach((l, i) => {
    const r = R[i];
    if (!r) return;
    l.style.minHeight = ''; r.style.minHeight = '';
    const h = Math.max(l.offsetHeight, r.offsetHeight) + 'px';
    l.style.minHeight = h; r.style.minHeight = h;   // min-height, so a notes box dragged taller still grows its row
  });
  syncing = false;
}
const rowObserver = new ResizeObserver(() => syncRowHeights());
function watchRowHeights() {
  rowObserver.disconnect();
  document.querySelectorAll('#gantt .g-row.g-l, #gantt .g-fixed textarea').forEach(el => rowObserver.observe(el));
}
window.addEventListener('resize', syncRowHeights);

function rowHtml(t, i, editing) {
  const s = keyToIdx(t.start), e = keyToIdx(t.end), n = State.plan.tasks.length;
  const span = spanLabel(s, e);
  // Planned work is 'Planned' until today's line reaches its start (a milestone's date), then 'Not started'.
  const startEdge = t.milestone ? s + 1 : s;
  const plannedLabel = todayFloatIdx() >= startEdge ? 'Not started' : 'Planned';
  const statusLabel = t.status === 'planned' ? plannedLabel : STATUSES[t.status];
  const title = esc(t.name) + ' · ' + (t.milestone ? endLabel(e, true) : span) + ' · ' + statusLabel;

  // Number column: plain in view mode or when auto-ordered; a dropdown when ordering by hand.
  let num;
  if (editing && !State.plan.autoOrder) {
    let o = '';
    for (let k = 1; k <= n; k++) o += '<option value="' + k + '"' + (k === i + 1 ? ' selected' : '') + '>' + k + '</option>';
    num = '<div class="g-num"><select class="ctl" data-act="num" data-id="' + t.id + '" title="Move to position">' + o + '</select></div>';
  } else {
    num = '<div class="g-num">' + (i + 1) + '</div>';
  }

  // View label
  let statusBit = '';
  if (t.status === 'risk') statusBit = '<span class="badge">At risk</span>';
  else if (t.status === 'progress') statusBit = '<span class="badge tint">In progress</span>';
  else if (t.status === 'done') statusBit = '<span>Done</span>';
  else if (t.status === 'planned') statusBit = '<span class="badge neutral' + (plannedLabel === 'Not started' ? ' strong' : '') + '">' + plannedLabel + '</span>';
  const view = '<div class="g-view"><div class="g-name">' + esc(t.name) + '</div><div class="g-meta"><span>' +
    (t.milestone ? 'Milestone · ' + esc(endLabel(e, true)) : esc(t.workstream) + ' · ' + esc(span)) + '</span>' + statusBit + '</div></div>';

  // Edit label
  let edit = '';
  if (editing) {
    const wsOpts = WORKSTREAMS.map(w => '<option' + (w === t.workstream ? ' selected' : '') + '>' + w + '</option>').join('');
    const stOpts = Object.keys(STATUSES).map(k => '<option value="' + k + '"' + (k === t.status ? ' selected' : '') + '>' + STATUSES[k] + '</option>').join('');
    let startOpts = '', endOpts = '';
    for (let k = FROM; k <= TO; k++) {
      startOpts += '<option value="' + idxToKey(k) + '"' + (k === s ? ' selected' : '') + '>' + halfOptionLabel(k) + '</option>';
      endOpts += '<option value="' + idxToKey(k) + '"' + (k === e ? ' selected' : '') + '>' + endLabel(k, true) + '</option>';
    }
    edit = '<div class="g-edit">' +
      '<input type="text" data-act="name" data-id="' + t.id + '" value="' + esc(t.name) + '" placeholder="Activity name">' +
      '<div class="erow">' +
        '<select class="ctl" data-act="ws" data-id="' + t.id + '" title="Workstream">' + wsOpts + '</select>' +
        '<select class="ctl" data-act="status" data-id="' + t.id + '" title="Status">' + stOpts + '</select>' +
        '<label class="check"><input type="checkbox" data-act="ms" data-id="' + t.id + '"' + (t.milestone ? ' checked' : '') + '> Milestone</label>' +
      '</div>' +
      '<div class="erow">' +
        '<select class="ctl" data-act="start" data-id="' + t.id + '" title="Start">' + startOpts + '</select>' +
        (t.milestone ? '' : '<span style="font-size:11px;font-weight:600">to</span><select class="ctl" data-act="end" data-id="' + t.id + '" title="End">' + endOpts + '</select>') +
        '<button type="button" class="rm" data-act="rm" data-id="' + t.id + '">Remove</button>' +
      '</div>' +
    '</div>';
  }

  // Notes column
  const notes = '<div class="g-notes"><div class="g-notes-text">' + esc(t.notes) + '</div>' +
    (editing ? '<textarea data-act="notes" data-id="' + t.id + '" placeholder="Notes">' + esc(t.notes) + '</textarea>' : '') + '</div>';

  // Timeline cell: a bar, or a diamond for a milestone
  let mark;
  if (t.milestone) {
    const left = ((s - FROM + 1) / NCOLS * 100).toFixed(3) + '%';
    mark = '<div class="ms' + (t.status === 'done' ? ' done' : '') + '" data-id="' + t.id + '" style="left:' + left + '" title="' + title + '"></div>';
  } else {
    const left = ((s - FROM) / NCOLS * 100).toFixed(3) + '%', width = ((e - s + 1) / NCOLS * 100).toFixed(3) + '%';
    const text = (e - s + 1) >= 3 ? esc(startLabel(s, false) + ' to ' + endLabel(e, false)) : '';
    mark = '<div class="bar' + (t.status === 'done' ? ' done' : '') + '" data-id="' + t.id + '" style="left:' + left + ';width:' + width + '" title="' + title + '"><span class="h l"></span>' + text + '<span class="h r"></span></div>';
  }

  return {
    left: '<div class="g-row g-l" data-id="' + t.id + '"><div class="g-label">' + num + view + edit + '</div>' + notes + '</div>',
    right: '<div class="g-row g-r" data-id="' + t.id + '"><div class="g-time">' + mark + '</div></div>',
  };
}

function setEditing(on) {
  State.editing = on;
  document.body.classList.toggle('editing', on);

document.getElementById('editBtn').addEventListener('click', () => {

document.getElementById('addBtn').addEventListener('click', () => {
  const start = idxToKey(clamp(todayIdx(), FROM, TO));
  const task = { id: uid(), name: 'New activity', workstream: 'Product', start, end: idxToKey(clamp(keyToIdx(start) + 1, FROM, TO)), status: 'planned', milestone: false, notes: '' };
  State.plan.tasks.push(task);

function onRangeChange() {
  const from = document.getElementById('rangeFrom').value, to = document.getElementById('rangeTo').value;
  State.plan.range.from = from;
  State.plan.range.to = monthKeyToIdx(to) < monthKeyToIdx(from) ? from : to;

}
document.getElementById('rangeFrom').addEventListener('change', onRangeChange);
document.getElementById('rangeTo').addEventListener('change', onRangeChange);

// Field edits inside the label column (event delegation on the gantt)
const gantt = document.getElementById('gantt');

gantt.addEventListener('input', ev => {
  const el = ev.target, act = el.dataset.act;
  if (act !== 'name' && act !== 'notes') return;
  const t = taskById(el.dataset.id);
  if (!t) return;
  if (act === 'name') t.name = el.value; else t.notes = el.value;
  queueSave();   // no redraw while typing; the view text refreshes on the next render
});

gantt.addEventListener('change', ev => {
  const el = ev.target, act = el.dataset.act, t = taskById(el.dataset.id);
  if (!act || !t) return;
  if (act === 'name') { t.name = el.value.trim() || 'Untitled activity'; afterChange(); return; }
  if (act === 'notes') { t.notes = el.value; queueSave(); return; }
  if (act === 'ws') { t.workstream = el.value; afterChange(); return; }
  if (act === 'status') { t.status = el.value; afterChange(); return; }
  if (act === 'ms') { t.milestone = el.checked; if (t.milestone) t.end = t.start; afterChange(); return; }
  if (act === 'start') {
    t.start = el.value;
    if (t.milestone || keyToIdx(t.end) < keyToIdx(t.start)) t.end = t.start;
    afterChange(); return;
  }
  if (act === 'end') {
    t.end = el.value;
    if (keyToIdx(t.end) < keyToIdx(t.start)) t.start = t.end;
    afterChange(); return;
  }
  if (act === 'num') {
    const to = clamp(parseInt(el.value, 10) - 1, 0, State.plan.tasks.length - 1);
    const from = State.plan.tasks.indexOf(t);
    State.plan.tasks.splice(from, 1);
    State.plan.tasks.splice(to, 0, t);
    afterChange(); return;
  }
});

gantt.addEventListener('click', ev => {
  const el = ev.target.closest('button[data-act="rm"]');
  if (!el) return;
  const t = taskById(el.dataset.id);
  if (!t) return;
  if (!confirm('Remove "' + t.name + '" from the plan?')) return;
  State.plan.tasks = State.plan.tasks.filter(x => x.id !== t.id);
  afterChange();
});

// ============================================================
// DRAG: move a bar, or resize it from either end, snapping to half-months
// ============================================================
gantt.addEventListener('pointerdown', ev => {
  if (!State.editing || ev.button !== 0) return;
  const el = ev.target.closest('.bar, .ms');
  if (!el) return;
  const t = taskById(el.dataset.id);
  if (!t) return;
  const rect = el.parentElement.getBoundingClientRect();
  const cellW = rect.width / NCOLS;
  const mode = ev.target.classList.contains('h') ? (ev.target.classList.contains('l') ? 'l' : 'r') : 'move';
  const drag = { x0: ev.clientX, s: keyToIdx(t.start), e: keyToIdx(t.end), mode, delta: 0 };
  el.classList.add('dragging');
  el.setPointerCapture(ev.pointerId);
  ev.preventDefault();

  const apply = () => {
    let s = drag.s, e = drag.e, d = drag.delta;
    if (t.milestone || drag.mode === 'move') { const len = e - s; s = clamp(s + d, FROM, TO - len); e = s + len; }
    else if (drag.mode === 'l') { s = clamp(s + d, FROM, e); }
    else { e = clamp(e + d, s, TO); }
    return { s, e };
  };
  const position = r => {
    if (t.milestone) { el.style.left = ((r.s - FROM + 1) / NCOLS * 100).toFixed(3) + '%'; }
    else { el.style.left = ((r.s - FROM) / NCOLS * 100).toFixed(3) + '%'; el.style.width = ((r.e - r.s + 1) / NCOLS * 100).toFixed(3) + '%'; }
  };
  const onMove = mv => {
    const d = Math.round((mv.clientX - drag.x0) / cellW);
    if (d === drag.delta) return;
    drag.delta = d;
    position(apply());
  };
  const onUp = up => {
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.removeEventListener('pointercancel', onUp);
    el.classList.remove('dragging');
    try { el.releasePointerCapture(up.pointerId); } catch (e) {}
    const r = apply();
    if (r.s !== drag.s || r.e !== drag.e) {
      t.start = idxToKey(r.s);
      t.end = idxToKey(r.e);
      afterChange();
    }
  };
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
});

// ============================================================

const SUN = '<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zm10-8a1 1 0 0 1-1 1h-2a1 1 0 1 1 0-2h2a1 1 0 0 1 1 1zM5 12a1 1 0 0 1-1 1H2a1 1 0 1 1 0-2h2a1 1 0 0 1 1 1zm13.07-6.66a1 1 0 0 1 0 1.41l-1.42 1.42a1 1 0 1 1-1.41-1.42l1.41-1.41a1 1 0 0 1 1.42 0zM7.76 16.24a1 1 0 0 1 0 1.42l-1.42 1.41a1 1 0 0 1-1.41-1.41l1.41-1.42a1 1 0 0 1 1.42 0zm10.31 2.83a1 1 0 0 1-1.42 0l-1.41-1.41a1 1 0 0 1 1.41-1.42l1.42 1.42a1 1 0 0 1 0 1.41zM7.76 7.76a1 1 0 0 1-1.42 0L4.93 6.34a1 1 0 0 1 1.41-1.41l1.42 1.41a1 1 0 0 1 0 1.42z"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').innerHTML = theme === 'dark' ? SUN : MOON;
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('ks-theme', next); } catch (e) {}
  applyTheme(next);
});
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('ks-theme'); } catch (e) {}
  applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
})();

// ============================================================
// BOOT
// ============================================================
// The frozen column headers sit directly under the page header, so they need its height.
const headerEl = document.querySelector('.header');
function setHeaderHeight() { document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px'); }
// Lift the frozen headers once rows start passing beneath them.
function updateStickyShadow() {
  const st = document.querySelector('#gantt .g-sticky');
  if (!st) return;
  st.classList.toggle('raised', st.getBoundingClientRect().top <= headerEl.offsetHeight + 1 && window.scrollY > 0);
}
window.addEventListener('scroll', updateStickyShadow, { passive: true });
window.addEventListener('resize', () => { setHeaderHeight(); updateStickyShadow(); });
setHeaderHeight();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(setHeaderHeight);
// Pick up edits made on another device when the tab comes back, unless a save is in flight here.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !State.editing && !State.dirty && !State.isSaving) loadPlan();
});
window.addEventListener('beforeunload', ev => {
  if (State.dirty) { ev.preventDefault(); ev.returnValue = ''; }
});
loadPlan();
</script>
